name: DBX MQTT certificate validation

on:
  push:
    branches:
      - ci/validate-dbx-mqtt-certificate-20261103

permissions:
  contents: read

concurrency:
  group: dbx-mqtt-certificate-validation-20261103
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'xue-ding-e/DBX-Next' && github.ref == 'refs/heads/ci/validate-dbx-mqtt-certificate-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
    steps:
      - name: Check out the exact validation commit
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Record source and available resources
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          git rev-parse HEAD HEAD^ | tee validation-evidence/source.txt
          test "$(git show -s --format=%P HEAD | wc -w)" -eq 1
          test "$(git rev-parse HEAD^)" = 1678447978718197b72ade567c29f012c81cff20
          bash .github/scripts/validate-mqtt-certificate.sh --check-sources
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          sha256sum apps/desktop/src/components/connection/ConnectionDialog.vue apps/desktop/src/components/connection/__tests__/ConnectionDialog.mqttCertificate.spec.ts crates/dbx-core/src/admin/mqtt/client.rs crates/dbx-core/src/connection/connection_secrets.rs crates/dbx-types/src/mqtt.rs .github/workflows/validate-mqtt-certificate.yml .github/scripts/validate-mqtt-certificate.sh > validation-evidence/source-sha256.txt
          free -h | tee validation-evidence/memory.txt
          df -h . | tee validation-evidence/disk.txt
      - name: Select the pinned official Rust toolchain
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustc +1.99.1 --version | tee validation-evidence/rustc.txt
          cargo +1.99.1 --version | tee validation-evidence/cargo.txt
      - name: Select Node for the component fixture
        timeout-minutes: 3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked frontend dependencies without lifecycle scripts
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.27.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          node --version | tee validation-evidence/node.txt
          pnpm --version | tee validation-evidence/pnpm.txt
      - name: Run only synthetic production-function regressions
        shell: bash
        run: bash .github/scripts/validate-mqtt-certificate.sh
      - name: Upload validation evidence only
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dbx-mqtt-certificate-validation-${{ github.run_id }}
          path: validation-evidence/
          if-no-files-found: error
          retention-days: 3
